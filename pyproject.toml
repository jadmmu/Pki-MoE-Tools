[project]
name = "pki-moe-tools"
version = "0.1.0"
description = "Backend-independent measurement infrastructure for MoE routing traces"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "matplotlib>=3.8"]

[project.scripts]
pki-moe = "pki_moe_tools.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pki_moe_tools"]

[tool.pytest.ini_options]
pythonpath = ["src"]
